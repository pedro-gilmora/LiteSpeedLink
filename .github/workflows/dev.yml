name: 'SourceCrafter.LiteSpeedLink: Build, Test & Deploy for .NET 10'

on:
  # Todo codigo que llega a dev se entrega, venga de un merge de PR o de un push
  # directo: el push es el unico hito comun a ambos casos.
  push:
    branches: [ dev ]
  # Permite relanzar el mismo trabajo a mano indicando el numero de la PR.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Numero de la PR a construir y desplegar'
        required: false
        type: string

# El token por defecto de estos eventos es de solo lectura: sin esto
# fallan tanto la creacion del release como la consulta de commits de la PR.
permissions:
  contents: write
  pull-requests: read
  actions: read

jobs:
  # Cada disparador trae los datos en un sitio distinto: el push los lleva en el
  # payload y el manual solo da, si acaso, el numero de la PR. Este trabajo
  # normaliza ambos casos para que el resto lea siempre las mismas salidas.
  resolve:
    name: 'Resolve revision'
    runs-on: 'ubuntu-latest'
    outputs:
      number: ${{ steps.pr.outputs.number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      base_ref: ${{ steps.pr.outputs.base_ref }}
      title: ${{ steps.pr.outputs.title }}
      url: ${{ steps.pr.outputs.url }}
      approver: ${{ steps.pr.outputs.approver }}
      proceed: ${{ steps.pr.outputs.proceed }}
    steps:
    - name: Read revision metadata
      id: pr
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        PR_NUMBER: ${{ inputs.pr_number }}
        APPROVER: ${{ github.event_name == 'workflow_dispatch' && github.triggering_actor || github.event.pusher.name }}
        HEAD_MESSAGE: ${{ github.event.head_commit.message }}
      run: |
        if [ -n "${PR_NUMBER}" ]; then
          pr=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}")

          # Un borrador no se despliega, y en el lanzamiento manual sobre una PR
          # solo se acepta la que ya esta integrada.
          draft=$(jq -r '.draft' <<< "$pr")
          merged=$(jq -r '.merged' <<< "$pr")

          number=${PR_NUMBER}
          head_sha=$(jq -r '.head.sha' <<< "$pr")
          head_ref=$(jq -r '.head.ref' <<< "$pr")
          base_ref=$(jq -r '.base.ref' <<< "$pr")
          title=$(jq -r '.title' <<< "$pr")
          url=$(jq -r '.html_url' <<< "$pr")
          proceed=$([ "$draft" = 'false' ] && [ "$merged" = 'true' ] && echo true || echo false)
        else
          # En un push la revision es el propio commit de cabeza: no hay PR que
          # consultar y la rama destino es la que recibe el push.
          number=''
          head_sha='${{ github.sha }}'
          head_ref='${{ github.ref_name }}'
          base_ref='${{ github.ref_name }}'
          title=$(head -n 1 <<< "${HEAD_MESSAGE}")
          url='${{ github.event.head_commit.url }}'
          proceed=$([ -n "${head_sha}" ] && echo true || echo false)
        fi

        {
          echo "number=${number}"
          echo "head_sha=${head_sha}"
          echo "head_ref=${head_ref}"
          echo "base_ref=${base_ref}"
          echo "title=${title}"
          echo "url=${url}"
          echo "approver=${APPROVER}"
          echo "proceed=${proceed}"
        } >> "$GITHUB_OUTPUT"

  try-deliver:
    name: '.NET 10 Build, Test & Deploy'
    # El transporte Memory usa MemoryMappedFile con nombre, que solo existe en Windows.
    runs-on: 'windows-latest'
    needs: resolve
    if: needs.resolve.outputs.proceed == 'true'
    defaults:
      run:
        shell: bash

    steps:
    - name: Get source code
      uses: actions/checkout@v4
      with:
        # El evento apunta al merge base, no al codigo integrado: hay que pedir
        # explicitamente la cabeza de la PR recien fusionada.
        ref: ${{ needs.resolve.outputs.head_sha }}
        # SharedMemory y los contratos parciales de DI se compilan desde los submodulos.
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Save GitHub Event Payload
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        PR_NUMBER: ${{ needs.resolve.outputs.number }}
      run: |
        # El evento push trae created_at como epoch, pero el de pull_request lo
        # trae en ISO 8601: se normalizan ambas formas antes de pedir el año.
        created_at='${{ github.event.repository.created_at }}'
        case "$created_at" in
          ''|*[!0-9]*) created_year=$( date -d "$created_at" +%Y ) ;;
          *)           created_year=$( date -d "@$created_at" +%Y ) ;;
        esac
        time_num=$(date +%H%M | sed 's/^0*//')  # Remove leading zeros to avoid octal interpretation
        time_num=${time_num:-0}  # Handle case where all digits are 0
        version=""$(( $(date --date='now' +%Y) - $created_year )).$(date +%y).$(date +%j).$(( $time_num / 5 ))""
        echo "VERSION=${version}" >> $GITHUB_ENV

        # El evento de PR no trae head_commit ni commits: ese par solo viaja en el
        # evento push. Se reconstruyen desde la API para que el resto del script siga
        # leyendo la misma forma. El titulo de la PR hace de asunto porque describe el conjunto.
        if [ -n "${PR_NUMBER}" ]; then
          gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/commits" --paginate > pr_commits.json
        else
          gh api "repos/${{ github.repository }}/compare/${{ github.event.before }}...${{ needs.resolve.outputs.head_sha }}" --jq '.commits' > pr_commits.json
        fi

        jq -n \
          --arg title "${{ needs.resolve.outputs.title }}" \
          --arg sha "${{ needs.resolve.outputs.head_sha }}" \
          --arg url "${{ needs.resolve.outputs.url }}" \
          --slurpfile commits pr_commits.json \
          '{
            head_commit: { id: $sha, message: $title, url: $url },
            commits: ($commits[0] | map({
              id: .sha,
              message: .commit.message,
              url: .html_url,
              author: { username: (.author.login // .commit.author.name) }
            }))
          }' > github_event.json

    - name: Test
      # NO_POSTGRES desactiva los tests que necesitan un servidor PostgreSQL local.
      run: dotnet test LiteSpeedLink.Tests/LiteSpeedLink.Tests.csproj -c Release -p:TestConstants=NO_POSTGRES -p:Version=${{ env.VERSION }}

    - name: Package
      run: |
        for project in \
          LiteSpeedLink.Abstractions/LiteSpeedLink.Abstractions.csproj \
          SourceCrafter.LiteSpeedLink.Core/SourceCrafter.LiteSpeedLink.Core.csproj \
          SourceCrafter.LiteSpeedLink.Client/SourceCrafter.LiteSpeedLink.Client.csproj \
          SourceCrafter.LiteSpeedLink.Server/SourceCrafter.LiteSpeedLink.Server.csproj \
          SourceCrafter.LiteSpeedLink.ClientGenerator/SourceCrafter.LiteSpeedLink.ClientGenerator.csproj \
          SourceCrafter.LiteSpeedLink.ServerGenerator/SourceCrafter.LiteSpeedLink.ServerGenerator.csproj
        do
          dotnet pack "$project" -c Release -p:Version=${{ env.VERSION }} || exit 1
        done

    - name: Detect packaged code changes
      # Publicar solo aporta valor si cambio el codigo que se empaqueta: se miran
      # los proyectos publicables, la metadata comun y los submodulos compilados dentro.
      id: changes
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        PR_NUMBER: ${{ needs.resolve.outputs.number }}
      run: |
        if [ -n "${PR_NUMBER}" ]; then
          files=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')
        else
          files=$(gh api "repos/${{ github.repository }}/compare/${{ github.event.before }}...${{ needs.resolve.outputs.head_sha }}" --jq '.files[].filename')
        fi

        changed=$(grep -E '^(LiteSpeedLink\.Abstractions/.*\.(cs|csproj)|SourceCrafter\.LiteSpeedLink\.(Core|Client|Server|ClientGenerator|ServerGenerator|Helpers)/.*\.(cs|csproj|props)|Package\.props|external/(SharedMemory|SourceCrafter\.DependencyInjection))$' <<< "$files" | head -n 1)

        echo "has_source_changes=$([ -n "$changed" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

    - name: Publish packages to Nuget
      # La rama que decide es la destino del merge: en un evento de PR github.ref_name
      # apunta a la referencia de la propia PR.
      if: needs.resolve.outputs.base_ref == 'dev' && steps.changes.outputs.has_source_changes == 'true'
      id: publish
      run: |
        declare -A packages

        # Los .snupkg acompañan a su .nupkg en el mismo push.
        for package in artifacts/packages/*.nupkg; do
          filename=$(basename "$package" .nupkg)
          package_name="${filename%%.[0-9]*}"   # everything before the last dot+digit
          version="${filename##$package_name.}" # everything after
          packages[$package_name]=$version

          output=$(dotnet nuget push "$package" --api-key ${{ secrets.NUGET_API_KEY }} --source "https://api.nuget.org/v3/index.json" 2>&1)

          if [ $? -ne 0 ]; then
            unset packages["$package_name"]
            echo -e "Nuget errors for $package:\n$output\n" >> errors.log
          fi
        done

        json_parts=()
        for name in "${!packages[@]}"; do
          json_parts+=("{\"package\":\"$name\",\"version\":\"${packages[$name]}\"}")
        done

        json=$(IFS=,; echo "[${json_parts[*]}]")

        echo "$json" >> nuget_pkgs.json

    - name: Notify Telegram & GitHub Release
      if: always()
      shell: pwsh
      env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      run:  |
        # Load the event payload as JSON
        $githubEvent = @{}
        if(Test-Path ./github_event.json) {
          $githubEvent = Get-Content -Path ./github_event.json -Raw | ConvertFrom-Json
        }

        #Read published packages
        $packages = $( $( if( Test-Path "nuget_pkgs.json" ) { Get-Content -Path nuget_pkgs.json -Raw } else { "[]" } ) | ConvertFrom-Json | Sort-Object { $_.package.Length })

        $telegramPackages, $githubPackages = if($packages){
        @"
        ---
        ### Packages

        | Package Name | Package Version |
        |---|---|$($packages | Sort-Object { $_.package.Length } | ForEach-Object { "
        | $($_.package) | [$($_.version)](https://www.nuget.org/packages/$($_.package)/$($_.version)) |" })
        "@,
        @"
        ---
        ### Packages
        $($packages | Sort-Object { $_.package.Length } | ForEach-Object { "
        [![$($_.package): $($_.version)](https://img.shields.io/nuget/v/$($_.package).svg?label=$($_.package)&style=plastic)](https://www.nuget.org/packages/$($_.package)/$($_.version))" })
        "@
        } else {"",""}

        # Load errors from errors logs file
        $errors = ""
        if (Test-Path "./errors.log") {
          echo "Found errors log file"
          $errors = $( Get-Content -Path "./errors.log" )
        }

        echo "These are the errors: [$errors]"

        function escape ([string] $text)
        {
          return $text -replace "([\\_\*\[\]\(\)~``>#\+\-=|{}\.!`"'])", '\$1'
        }

        # No se escapan las comillas aqui: ConvertTo-Json ya lo hace al serializar el
        # cuerpo, y hacerlo dos veces deja barras invertidas visibles en el mensaje.
        function releaseTrimming ([string] $text)
        {
          return $text -replace '^\[Release\]\s*', ''
        }

        # Un mensaje de commit puede traer cuerpo, y cada salto de linea rompe la fila de
        # la tabla en la que se inserta. Nos quedamos con el asunto y colapsamos el resto.
        function subject ([string] $text)
        {
          $first = ($text -split '\r?\n')[0]
          return (releaseTrimming $first).Trim()
        }

        # En una celda de tabla de GitHub la barra vertical abre una columna nueva, asi
        # que hay que escaparla. El resto de la sintaxis de GitHub no rompe la fila, y
        # escaparla sobraria: no es MarkdownV2 de Telegram.
        function ghCell ([string] $text)
        {
          return (subject $text) -replace '\|', '\|'
        }

        $isRelease = $githubEvent.head_commit.message -match '^\[Release\]\s*'
        $headCommit = subject $githubEvent.head_commit.message
        # Los commits de la PR llegan del mas antiguo al mas nuevo y el titulo ya encabeza
        # el mensaje: se excluye por id el que coincida con la cabeza, y se listan del mas
        # reciente al mas antiguo.
        $commits = @( $githubEvent.commits | Where-Object { $_.id -ne $githubEvent.head_commit.id } )
        [array]::Reverse($commits)
        $failed = '${{ job.status }}' -eq 'failure'

        $status, $icon, $message = if ($failed -or $errors) {
          'failed', '💥', $errors
        } elseif ('${{ job.status }}' -eq 'success') {
          'successfully completed', '✅', $headCommit
        } else {
          'cancelled', '⛔', 'User aborted the action'
        }

        # El enlace debe apuntar al job de construccion, no al de resolucion, y
        # cuando algun paso falla se ancla directamente al log de ese paso.
        $job = ((gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" --paginate --jq '[.jobs[] | select(.name == ".NET 10 Build, Test & Deploy")] | last') -join '') | ConvertFrom-Json
        $jobName = $job.name
        $failedStep = @($job.steps | Where-Object { $_.conclusion -eq 'failure' })[0]
        $jobUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/$($job.id)" + $(if ($failedStep) { "#step:$($failedStep.number):1" })

        $message = @"
        # 🚀 $(escape '${{ github.workflow }}') \#${{ github.run_number }}

        $icon Build $status

        👤 **Triggered by:** [${{ github.triggering_actor }}](https://github.com/${{ github.triggering_actor }})

        🌿 **Branch:** $(escape '${{ needs.resolve.outputs.head_ref }}') → $(escape '${{ needs.resolve.outputs.base_ref }}')

        🔀 **Merged by:** [${{ needs.resolve.outputs.approver }}](https://github.com/${{ needs.resolve.outputs.approver }})

        🔗 **Change:** [$( $githubEvent.head_commit.id.Substring(0,8) )]($( $githubEvent.head_commit.url ))

        ⚙️ **Job** [$jobName]($jobUrl)

        ---
        ### $(escape ( subject $githubEvent.head_commit.message) )$(if($commits.Count -gt 0 ) { "
        #### Other changes

        | Commit Id | Description | Author |
        |---|---|---|
        $([string]::Join("
        ", $( $commits |
        ForEach-Object {
            "| [$( $_.id.Substring(0,8) )]($( $_.url )) | $( escape ( subject $_.message ) ) | [$( $_.author.username )](https://github.com/$($_.author.username)) |"
        })))"
        })$( if($errors) { "
        ---
        #### Errors

        ``````
        $( escape $errors.Trim() )
        ``````" } )

        $telegramPackages
        "@

        if( $isRelease -and -not $failed )
        {
          $releaseNotes = if($commits.Count -gt 0) {
        @"
        | ID | Message | Author |
        |---|---|---|
        $([string]::Join("
        ", $( $commits |
        ForEach-Object {
              "| [$($_.id.Substring(0,8))]($($_.url)) | $( ghCell $_.message ) | [$( $_.author.username )]( https://github.com/$($_.author.username) ) |"
        })))

        $githubPackages
        "@
          } else { "$githubPackages" }

          # El cuerpo va entre comillas: sin ellas PowerShell parte el argumento por cada
          # espacio y salto de linea, y gh recibe la tabla despedazada.
          # El tag debe colgar del commit integrado: en un evento de PR el
          # repositorio local esta en esa cabeza, pero gh apuntaria por defecto a
          # la rama por defecto del repositorio.
          gh release create v${{ env.VERSION }} --target ${{ needs.resolve.outputs.head_sha }} -t "$(subject $githubEvent.head_commit.message)" -n "$releaseNotes"
        }

        Write-Host $message

        $uri = "https://api.telegram.org/bot${{ secrets.TGBOT_TOKEN }}/sendRichMessage"

        $body = @{
          chat_id = ${{ secrets.SC_CHATID }}
          rich_message = @{ markdown = $message } | ConvertTo-Json
        }

        # Cada repositorio publica en su propio tema del grupo (variable de repositorio).
        if ('${{ vars.TG_THREAD_ID }}') { $body.message_thread_id = '${{ vars.TG_THREAD_ID }}' }

        Invoke-RestMethod -Uri $uri -Method Post -Body $body
